[build]
  publish = "."

[[redirects]]
  from = "https://www.steadycutlawns.com/*"
  to = "https://steadycutlawns.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
